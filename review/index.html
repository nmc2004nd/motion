<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ôn tập src/core Motion</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Điều hướng ôn tập">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">Motion review</p>
            <h1>src/core</h1>
          </div>
        </div>

        <nav class="module-nav" id="moduleNav"></nav>

        <section class="progress-panel" aria-label="Tiến độ ôn tập">
          <div class="progress-row">
            <span>Tiến độ</span>
            <strong id="progressText">0%</strong>
          </div>
          <div class="progress-track">
            <span id="progressBar"></span>
          </div>
          <button class="ghost-btn" id="resetProgressBtn" type="button">Reset</button>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Tài liệu nguồn</p>
            <h2>Core + Force Models Review</h2>
          </div>
          <div class="mode-tabs" role="tablist" aria-label="Chế độ ôn tập">
            <button class="mode-tab active" data-mode="study" type="button">Học</button>
            <button class="mode-tab" data-mode="cards" type="button">Flashcards</button>
            <button class="mode-tab" data-mode="quiz" type="button">Quiz</button>
            <button class="mode-tab" data-mode="tuning" type="button">Tham số</button>
            <button class="mode-tab" data-mode="defense" type="button">Phản biện</button>
          </div>
        </header>

        <section class="hero-panel">
          <div class="pipeline-visual" aria-label="Pipeline src/core">
            <div class="sensor-grid" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="flow-field" aria-hidden="true">
              <i style="--x: 15%; --y: 25%; --r: -18deg; --l: 36px"></i>
              <i style="--x: 39%; --y: 42%; --r: 8deg; --l: 58px"></i>
              <i style="--x: 62%; --y: 31%; --r: 24deg; --l: 44px"></i>
              <i style="--x: 77%; --y: 63%; --r: -32deg; --l: 52px"></i>
            </div>
          </div>
          <div class="hero-copy">
            <p class="eyebrow">Luồng cần thuộc</p>
            <h3>Ảnh grayscale thành displacement field có valid mask.</h3>
            <div class="pipeline-steps" id="pipelineSteps"></div>
          </div>
        </section>

        <section class="content-grid" id="studyView"></section>

        <section class="panel hidden" id="cardsView">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Flashcards</p>
              <h3 id="cardCounter">1 / 1</h3>
            </div>
            <div class="cluster">
              <button class="icon-btn" id="prevCardBtn" type="button" aria-label="Thẻ trước">‹</button>
              <button class="icon-btn" id="nextCardBtn" type="button" aria-label="Thẻ sau">›</button>
            </div>
          </div>
          <article class="flashcard" id="flashcard" tabindex="0">
            <p id="cardModule"></p>
            <h4 id="cardQuestion"></h4>
            <div class="card-answer hidden" id="cardAnswer"></div>
          </article>
          <div class="answer-actions">
            <button class="primary-btn" id="revealCardBtn" type="button">Hiện đáp án</button>
            <button class="ghost-btn" id="knownCardBtn" type="button">Đã nhớ</button>
            <button class="ghost-btn" id="reviewCardBtn" type="button">Cần ôn lại</button>
          </div>
        </section>

        <section class="panel hidden" id="quizView">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Quiz nhanh</p>
              <h3 id="quizTitle">Câu hỏi 1</h3>
            </div>
            <strong class="score-pill" id="quizScore">0 đúng</strong>
          </div>
          <div class="quiz-body">
            <h4 id="quizQuestion"></h4>
            <div class="options" id="quizOptions"></div>
            <p class="feedback" id="quizFeedback"></p>
          </div>
          <div class="answer-actions">
            <button class="primary-btn" id="submitQuizBtn" type="button">Kiểm tra</button>
            <button class="ghost-btn" id="nextQuizBtn" type="button">Câu tiếp</button>
          </div>
        </section>

        <section class="content-grid hidden" id="tuningView"></section>

        <section class="panel hidden" id="defenseView">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Câu hỏi phản biện</p>
              <h3>Luyện trả lời vấn đáp</h3>
            </div>
            <input class="search-input" id="defenseSearch" type="search" placeholder="Lọc theo từ khóa..." />
          </div>
          <div class="defense-list" id="defenseList"></div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
